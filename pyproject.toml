[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "ubuntu-ai-assistant"
version = "2.0.2"
description = "Framework local para agentes inteligentes e administração segura do Ubuntu"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Andre Anderson Feitoza" }
]
keywords = [
    "ubuntu",
    "linux",
    "ai-agent",
    "ollama",
    "automation",
    "cli",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "typer>=0.16.0",
    "rich>=14.0.0",
    "requests>=2.32.0",
    "psutil>=7.0.0",
    "pydantic>=2.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.12.0",
]

[project.scripts]
ubuntu-ai = "ubuntu_ai.cli.app:app"
ubuntu-ai-gui = "ubuntu_ai.gui.app:main"
ubuntu-ai-install-launcher = "ubuntu_ai.gui.launcher_installer:main"
ubuntu-ai-setup = "ubuntu_ai.cli.setup:main"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/ubuntu_ai"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/ubuntu-ai-source.zip",
    "/ubuntu-ai-current.zip",
    "/projeto.txt",
    "/src_files.txt",
    "/test_files.txt",
]

[dependency-groups]
dev = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7",
    "mkdocstrings>=1.0.6",
    "mkdocstrings-python>=2.0.5",
    "pre-commit>=4.6.1",
    "pytest-cov>=7.1.0",
]
