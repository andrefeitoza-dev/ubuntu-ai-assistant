[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "ubuntu-ai-assistant"
version = "0.1.0"
description = "AI Assistant for Ubuntu Administration"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

authors = [
    { name = "Andre Anderson Feitoza" }
]

dependencies = [
    "typer>=0.16.0",
    "rich>=14.0.0",
    "requests>=2.32.0",
    "psutil>=7.0.0",
    "pydantic>=2.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.12.0",
]

[project.scripts]
ubuntu-ai = "ubuntu_ai.cli.app:app"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
pythonpath = ["src"] 

[tool.hatch.build.targets.wheel]
packages = ["src/ubuntu_ai"]