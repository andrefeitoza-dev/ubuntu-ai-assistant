site_name: Ubuntu AI Assistant
site_description: Assistente local para administração inteligente do Ubuntu
site_author: André Anderson Feitoza

repo_name: ubuntu-ai-assistant

docs_dir: docs
site_dir: site

theme:
  name: material
  language: pt-BR
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight
    - toc.follow

plugins:
  - search

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Início: checkpoint.md

  - Usuário:
      - Instalação: installation.md
      - Guia de uso: user-guide.md
      - Administração remota por SSH: remote-administration.md
      - Configurações, perfis e plugins: configuration-profiles-plugins.md
      - VS Code: vscode-integration.md
      - Exemplos: examples.md
      - Solução de problemas: troubleshooting.md

  - Desenvolvimento:
      - Guia do desenvolvedor: developer-guide.md
      - Compatibilidade de plugins: plugin-compatibility.md
      - Processo de release: release-process.md

  - Arquitetura:
      - Arquitetura Geral: architecture.md
      - Produto: product-architecture.md
      - Contexto: project-context.md
      - Review 0.6: architecture-review-0.6.md
      - Review 1.0: architecture-review-1.0.md

  - ADR:
      - ADR-001 Core Architecture: adr/ADR-001-core-architecture.md

  - Sprints:
      - AR-03 Controlled Executor: sprints/AR-03-controlled-executor.md

  - Roadmap:
      - Roadmap: roadmap.md

  - Milestones:
      - M4.1 Memory Engine: milestones/M4.1-memory-engine.md
      - M4.2 Context Engine: milestones/M4.2-context-engine.md
      - M4.3 Conversation Engine: milestones/M4.3-conversation-engine.md
      - M4.3.1 Knowledge Repository: milestones/M4.3.1-knowledge-repository.md
      - M4.4 Knowledge Engine: milestones/M4.4-knowledge-engine.md
