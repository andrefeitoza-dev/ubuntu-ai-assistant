name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Validate and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Synchronize locked dependencies
        run: uv sync --all-extras --dev --locked
      - name: Match tag and package version
        shell: bash
        run: |
          PACKAGE_VERSION="$(uv run python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "${GITHUB_REF_NAME}" = "v${PACKAGE_VERSION}"
          uv run python scripts/check_release.py
      - name: Quality, tests, architecture and documentation
        run: |
          uv run ruff check src tests scripts
          uv run pytest -q
          uv run python scripts/check_architecture.py
          uv run python scripts/architecture_audit.py
          uv run mkdocs build --strict
      - name: Build and audit distribution
        run: |
          uv build
          WHEEL="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          uv run python scripts/build_deb.py "$WHEEL"
          DEB="$(find dist -maxdepth 1 -name '*.deb' -print -quit)"
          uv run python scripts/validate_deb.py "$DEB"
          uv run python scripts/release_artifacts.py validate dist
          uv run python scripts/release_artifacts.py checksums dist
          uv run python scripts/release_artifacts.py verify dist
      - name: Validate clean lifecycle
        run: |
          WHEEL="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          uv run python scripts/validate_clean_lifecycle.py "$WHEEL"
      - name: Attest build provenance without stored signing keys
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: docs/releases/v2.0.1.md
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.deb
            dist/SHA256SUMS
          fail_on_unmatched_files: true
