name: CI

on:
  push:
    branches:
      - main
      - "develop/**"
      - "chore/**"
      - "feature/**"
      - "fix/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality, tests and architecture
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Synchronize locked dependencies
        run: uv sync --all-extras --dev --locked
      - name: Ruff lint
        run: uv run ruff check src tests scripts --output-format=github
      - name: Run tests with coverage
        run: |
          uv run pytest \
            --cov=src/ubuntu_ai \
            --cov-config=.coveragerc \
            --cov-report=term-missing \
            --cov-report=xml \
            --junitxml=test-results.xml
      - name: Validate architecture and documentation
        run: |
          uv run python scripts/check_architecture.py
          uv run python scripts/architecture_audit.py
          uv run python scripts/check_gui_architecture.py
          uv run mkdocs build --strict
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: quality-reports
          path: |
            coverage.xml
            test-results.xml
          if-no-files-found: warn
          retention-days: 14

  artifacts:
    name: Build and audit artifacts
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Build wheel, source archive and Debian package
        run: |
          uv build
          WHEEL="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          uv run python scripts/build_deb.py "$WHEEL"
      - name: Audit and checksum artifacts
        run: |
          DEB="$(find dist -maxdepth 1 -name '*.deb' -print -quit)"
          uv run python scripts/validate_deb.py "$DEB"
          uv run python scripts/release_artifacts.py validate dist
          uv run python scripts/release_artifacts.py checksums dist
          uv run python scripts/release_artifacts.py verify dist
      - name: Install GUI runtime dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes python3-tk
      - name: Validate clean lifecycle
        run: |
          WHEEL="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          uv run python scripts/validate_clean_lifecycle.py "$WHEEL"
      - name: Upload audited artifacts
        uses: actions/upload-artifact@v6
        with:
          name: distribution-artifacts
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.deb
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
